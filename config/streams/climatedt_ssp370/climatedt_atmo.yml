# ---------------------------------------------------------------------------------------------
# ssp370 PROJECTIONS variant of config/streams/climatedt/climatedt_atmo.yml, for the test phase.
#
# Identical to the training stream except for two keys:
#   filenames       -> the ssp370 projections zarr (2015-01-01 .. 2049-12-31)
#   statistics_from -> the HISTORICAL zarr the model was trained on
#
# statistics_from is essential, not cosmetic. Each anemoi dataset carries its own mean/stdev, so
# normalising ssp370 by its own statistics would re-centre the projection's trend to zero -- the
# warming being tested would be subtracted out before the model saw it. Concretely: co2 is
# continuous to 0.01 ppm across the 2014/2015 handover, but with each file's own statistics the
# normalised input jumps -4.0 sigma; pinned to the historical statistics it stays at +2.43.
# ---------------------------------------------------------------------------------------------

CLIMATEDT_ATMO :
  type : anemoi
  filenames : ['/e/data1/climateai/hclimrep/data/ifs_nemo/anemoi-climatedt-gen2-ifs-nemo-projections-ssp370-5km-r1-H64-20150101-20491231.zarr']
  # normalise exactly as training did -- see the banner above
  statistics_from : '/e/data1/climateai/hclimrep/data/ifs_nemo/anemoi-climatedt-gen2-ifs-nemo-baseline-hist-5km-r1-H64-19900101-20141231.zarr'
  stream_id : 0
  # Unlike era5.yml, vertical velocity, skin temperature and precipitation are all kept as source
  # and target channels. Note that over ice-free ocean, skin temperature is near-identical to SST
  # (mean |diff| 0.27 K), so it carries sea-surface information even though
  # mean_sea_surface_temperature itself is excluded. Over sea ice the two decouple, and skin
  # temperature instead reports the ice surface. It is NaN-free everywhere, unlike the ocean fields.
  # The ocean/sea-ice channels live in climatedt_ocean.yml and are excluded here.
  source_exclude : ['mean_sea_ice_area_fraction', 'mean_sea_ice_thickness', 'mean_sea_surface_height',
                    'mean_sea_surface_salinity', 'mean_sea_surface_temperature',
                    'mean_total_column_heat_content']
  target_exclude : ['mean_sea_ice_area_fraction', 'mean_sea_ice_thickness', 'mean_sea_surface_height',
                    'mean_sea_surface_salinity', 'mean_sea_surface_temperature',
                    'mean_total_column_heat_content']
  # constant-in-time and computed-forcing variables are dropped from source/target automatically,
  # so orography / land_sea_mask / lat-lon / insolation / julian day are only picked up here.
  geoinfo_channels : ['orography', 'land_sea_mask', 'insolation', 'cos_latitude', 'sin_latitude',
                      'cos_longitude', 'sin_longitude', 'cos_julian_day', 'sin_julian_day']
  loss_weight : 1.
  # Prescribed-warming experiment knob: constant offset added to the named channel(s)
  # everywhere (all points, all times), in raw physical units, before normalisation.
  # skin_temperature tracks SST over ice-free ocean, so a warmed-ocean run must shift it in
  # step with mean_sea_surface_temperature in CLIMATEDT_OCEAN. The offset here is unavoidably
  # applied over land too, where it is not physical -- consider dropping skin_temperature from
  # this stream instead if that matters for the experiment.
  #warmup_offset_k :
  #  skin_temperature : 2k
  location_weight : cosine_latitude
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: 20000
  frequency : 24:00:00
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
    # sampling_rate : 0.2
  pred_head :
    ens_size : 1
    num_layers : 1
  channel_weights :
